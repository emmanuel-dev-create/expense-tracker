<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <form class="main-container" id="expense-form">
         <h3 id="spentAmountDisplay"></h3>
         <input type="text" id="description" placeholder="Description eg. Bolt to CBD" required>
         <input type="number" id="amount" placeholder="Expense Amount" required>

         <select name="category" id="category">
            <option value="Transport" id="transport">Transport</option>
            <option value="Food" id="food">Food</option>
            <option value="Entertainment" id="entertainment">Entertainment</option>
            <option value="Rent" id="rent">Rent</option>
         </select>

         <div id="expenseList"></div>

         <button>Save Expanse</button>
    </form>
    <script src="index.js"></script>
</body>
</html>
